<!doctype html>
<html lang="ko">
  <head>
    <!-- 문서 기본 설정과 CSS 연결 -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="책에 표시한 문장을 사진에서 추출하고 보관하는 웹앱"
    />
    <title>TextShot</title>
    <link rel="stylesheet" href="./css/resset.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <div id="app" class="app-shell">
      <!-- 앱 이름이 보이는 상단 헤더 -->
      <header class="app-header">
        <div class="app-header__inner">
          <h1 class="app-logo">TextShot</h1>
        </div>
      </header>

      <main id="main-content" class="main-content">
        <section class="home" aria-labelledby="home-title">
          <!-- 서비스의 목적을 알려주는 홈 소개 영역 -->
          <div class="home__intro">
            <p class="home__eyebrow">나만의 문장 보관함</p>
            <h2 id="home-title" class="home__title">
              책 속에 표시한 문장을<br />간직하세요
            </h2>
            <p class="home__description">
              형광펜, 밑줄 또는 ㄴ·ㄱ으로 표시한 책 페이지를 촬영하거나 선택해
              주세요.
            </p>
          </div>

          <!-- 사진 촬영과 사진 선택 버튼을 담은 영역 -->
          <section class="capture-panel" aria-labelledby="capture-title">
            <h3 id="capture-title" class="capture-panel__title">
              책 페이지 준비하기
            </h3>
            <p class="capture-panel__description">
              사진을 선택하면 전송 전에 한 번 더 확인할 수 있어요.
            </p>

            <div class="capture-actions">
              <button
                id="camera-button"
                class="button button--primary"
                type="button"
              >
                사진 촬영하기
              </button>
              <button
                id="gallery-button"
                class="button button--secondary"
                type="button"
              >
                사진 선택하기
              </button>
            </div>
          </section>

          <!-- 이번 달에 남은 무료 추출 횟수 안내 -->
          <aside class="usage-card" aria-label="무료 추출 이용량">
            <span class="usage-card__label">이번 달 무료 추출</span>
            <strong class="usage-card__count">10회 남음</strong>
          </aside>

          <p class="usage-note">
            문장이 정상적으로 추출된 경우에만 1회 차감됩니다.
          </p>
        </section>
      </main>

      <!-- 홈과 보관함을 오가는 하단 메뉴 -->
      <nav class="bottom-nav" aria-label="주요 메뉴">
        <button
          class="bottom-nav__item bottom-nav__item--active"
          type="button"
          aria-current="page"
        >
          홈
        </button>
        <button class="bottom-nav__item" type="button">보관함</button>
      </nav>
    </div>

    <!-- 화면을 모두 만든 뒤 JavaScript 실행 -->
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
